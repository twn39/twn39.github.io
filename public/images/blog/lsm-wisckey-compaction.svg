<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" fill="none">
  <rect width="960" height="430" rx="12" fill="#0D0D10"/>
  <defs>
    <pattern id="grid2" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#232329"/>
    </pattern>
  </defs>
  <rect width="960" height="430" rx="12" fill="url(#grid2)"/>
  <rect x="1" y="1" width="958" height="428" rx="11" stroke="#27272A" stroke-width="2"/>

  <line x1="0" y1="44" x2="960" y2="44" stroke="#27272A"/>
  <text x="24" y="27" fill="#A1A1AA" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="1">FIG 02.A — BARISTA-KV · WISCKEY KEY-VALUE SEPARATION &amp; RIBBON FILTER LSM</text>
  <text x="790" y="27" fill="#DA9468" font-family="JetBrains Mono, monospace" font-size="11">WRITE AMP: 3.1x (VS 14.8x)</text>

  <!-- Left: Write Path MemTable -->
  <rect x="40" y="80" width="230" height="296" rx="8" fill="#121216" stroke="#3F3F46"/>
  <text x="60" y="110" fill="#FAFAFA" font-family="Inter, sans-serif" font-size="14" font-weight="600">Write Path (Foreground)</text>
  <rect x="60" y="132" width="190" height="62" rx="6" fill="#18181B" stroke="#10B981"/>
  <text x="76" y="156" fill="#10B981" font-family="JetBrains Mono, monospace" font-size="11">Lock-Free Arena Skiplist</text>
  <text x="76" y="176" fill="#A1A1AA" font-family="JetBrains Mono, monospace" font-size="10">Key + 12B vLog Pointer</text>

  <rect x="60" y="214" width="190" height="140" rx="6" fill="#1C1613" stroke="#DA9468"/>
  <text x="76" y="240" fill="#F2D7C2" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600">Append-Only Value Log</text>
  <text x="76" y="262" fill="#DA9468" font-family="JetBrains Mono, monospace" font-size="10">[CRC32][KeyLen][Val ≥ 256B]</text>
  <text x="76" y="286" fill="#A1A1AA" font-family="JetBrains Mono, monospace" font-size="10">● Never rewritten in LSM</text>
  <text x="76" y="306" fill="#A1A1AA" font-family="JetBrains Mono, monospace" font-size="10">● Sequential NVMe ZNS/IO</text>
  <text x="76" y="326" fill="#71717A" font-family="JetBrains Mono, monospace" font-size="10">● Async GC on cold segments</text>

  <!-- Arrow to LSM Tree -->
  <path d="M276 163 L334 163" stroke="#10B981" stroke-width="1.5"/>
  <polygon points="340,163 332,158 332,168" fill="#10B981"/>
  <text x="282" y="151" fill="#10B981" font-family="JetBrains Mono, monospace" font-size="10">Keys Only</text>

  <!-- Center: Compact Key-Only LSM Levels -->
  <rect x="346" y="80" width="324" height="296" rx="8" fill="#121216" stroke="#3F3F46"/>
  <text x="368" y="110" fill="#FAFAFA" font-family="Inter, sans-serif" font-size="14" font-weight="600">Compact Key-Index LSM Tree</text>

  <rect x="368" y="132" width="280" height="44" rx="5" fill="#18181B" stroke="#27272A"/>
  <text x="384" y="158" fill="#E4E4E7" font-family="JetBrains Mono, monospace" font-size="11">L0 · 4 Sub-Sharded SSTs (64 MB)</text>

  <rect x="368" y="190" width="280" height="52" rx="5" fill="#18181B" stroke="#3F3F46"/>
  <text x="384" y="213" fill="#FAFAFA" font-family="JetBrains Mono, monospace" font-size="11">L1 · Ribbon Filter + Prefix Index</text>
  <text x="384" y="230" fill="#10B981" font-family="JetBrains Mono, monospace" font-size="10">-31% RAM vs 10-bit Bloom Filter</text>

  <rect x="368" y="256" width="280" height="100" rx="5" fill="#09090B" stroke="#27272A"/>
  <text x="384" y="282" fill="#DA9468" font-family="JetBrains Mono, monospace" font-size="11">L2 / L3 · Rate-Paced Compaction</text>
  <text x="384" y="304" fill="#A1A1AA" font-family="JetBrains Mono, monospace" font-size="10">PID Controller monitors L0 backlog</text>
  <text x="384" y="324" fill="#A1A1AA" font-family="JetBrains Mono, monospace" font-size="10">&amp; NVMe queue depth via io_uring</text>
  <text x="384" y="344" fill="#71717A" font-family="JetBrains Mono, monospace" font-size="10">Zero foreground write stalls</text>

  <!-- Right: Tail Latency Readout -->
  <rect x="702" y="80" width="218" height="296" rx="8" fill="#121216" stroke="#3F3F46"/>
  <text x="722" y="110" fill="#FAFAFA" font-family="Inter, sans-serif" font-size="14" font-weight="600">Telemetry (1KB Val)</text>
  <g font-family="JetBrains Mono, monospace">
    <text x="722" y="152" fill="#71717A" font-size="10">POINT GET P99</text>
    <text x="722" y="176" fill="#10B981" font-size="22" font-weight="700">68 μs</text>

    <text x="722" y="220" fill="#71717A" font-size="10">WRITE P999 (NO STALL)</text>
    <text x="722" y="244" fill="#DA9468" font-size="22" font-weight="700">1.14 ms</text>

    <text x="722" y="288" fill="#71717A" font-size="10">RIBBON FILTER FPR</text>
    <text x="722" y="312" fill="#FAFAFA" font-size="20" font-weight="700">0.82%</text>
    <text x="722" y="336" fill="#71717A" font-size="10">@ 6.9 bits / key</text>
  </g>

  <line x1="0" y1="394" x2="960" y2="394" stroke="#27272A"/>
  <text x="24" y="416" fill="#52525B" font-family="JetBrains Mono, monospace" font-size="10">DWG NO. BRK-KV-02 · IO_URING SQPOLL + PARTITIONED RIBBON FILTERS</text>
</svg>
